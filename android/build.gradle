buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["CaptureStudio_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    // AGP is not declared here on purpose — the consuming app owns its build
    // toolchain version, and pinning one from a library only ever gets overridden.
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// RN 0.82+ is New Architecture only — `newArchEnabled` no longer gates anything.
apply plugin: "com.facebook.react"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["CaptureStudio_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["CaptureStudio_" + name]).toInteger()
}

android {
  namespace "com.capturestudio"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion 29
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // Set explicitly so Java and Kotlin agree — relying on the Kotlin plugin to
  // infer jvmTarget from compileOptions breaks the moment either side changes.
  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // WorkManager for background image processing
  implementation "androidx.work:work-runtime-ktx:2.9.0"

  // ExifInterface for image orientation
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}

react {
  jsRootDir = file("../src/")
  libraryName = "CaptureStudio"
  codegenJavaPackageName = "com.capturestudio"
}
